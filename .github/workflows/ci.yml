name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  C3C_VERSION: "0.8.3"
  VULKAN_SDK_VERSION: "1.4.357.0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Fine-grained PAT (Contents: read) covering this repo, gpu.c3l, and
          # the private binding submodules.
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Cache c3c
        uses: actions/cache@v4
        with:
          path: ~/tools/c3
          key: c3c-linux-${{ env.C3C_VERSION }}

      - name: Install c3c
        run: |
          if [ ! -x ~/tools/c3/c3c ]; then
            mkdir -p ~/tools
            curl -fsSL -o /tmp/c3.tar.gz \
              "https://github.com/c3lang/c3c/releases/download/v${C3C_VERSION}/c3-linux.tar.gz"
            tar -xzf /tmp/c3.tar.gz -C ~/tools
          fi
          echo "$HOME/tools/c3" >> "$GITHUB_PATH"

      - name: Install lavapipe, xvfb and SDK dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools xvfb xz-utils libxcb-xinput0 libxcb-xinerama0 libxcb-cursor0

      - name: Cache Vulkan SDK
        uses: actions/cache@v4
        with:
          path: ~/tools/vulkan
          key: vulkan-linux-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        run: |
          if [ ! -f ~/tools/vulkan/x86_64/lib/libVkLayer_khronos_validation.so ]; then
            mkdir -p ~/tools/vulkan
            curl -fsSL -o /tmp/vulkan-sdk.tar.xz \
              "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkan_sdk.tar.xz"
            tar -xJf /tmp/vulkan-sdk.tar.xz -C ~/tools/vulkan --strip-components=1
          fi
          SDK_ROOT="$HOME/tools/vulkan/x86_64"
          echo "VULKAN_SDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$SDK_ROOT/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$SDK_ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/bin" >> "$GITHUB_PATH"

      - name: ABI check and shader build
        run: python3 scripts/build_shaders.py --check

      - name: Run samples
        run: |
          export VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)
          mkdir -p out
          c3c run shared_selftest
          c3c run frame_upload_selftest
          c3c run root_pointer_compute
          c3c run bindless_texture_compute
          c3c run memory_report
          c3c run bindless_stress
          c3c run multithreaded_recording
          c3c run pipeline_cache_timing
          c3c run offscreen_triangle -- --screenshot out/offscreen_triangle.png
          c3c run image_processing -- --screenshot out/image_processing.png
          c3c run texture_streaming
          for s in minimal_triangle hello_triangle_sdl gpu_driven_draw_sdl textured_cube texture_filtering volume_texture particle_sim frustum_culling shadow_mapping deferred_shading pbr_materials present_mode_explorer mesh_shading stencil_mask skybox compressed_textures; do
            c3c build "$s"
            xvfb-run -a env SDL_VIDEODRIVER=x11 WAYLAND_DISPLAY= \
              "./build/$s" --frames 30 --screenshot "out/$s.png"
          done
          c3c build cornell_box
          xvfb-run -a env SDL_VIDEODRIVER=x11 WAYLAND_DISPLAY= \
            ./build/cornell_box --validate --frames 1 \
              --screenshot out/cornell_box.png
          ls -la out/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out/*.png
